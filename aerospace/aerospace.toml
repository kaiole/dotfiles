# AeroSpace (macOS). Loosely mirrors hypr/config/keybindings.lua with alt in
# place of Super. Commands: https://nikitabobko.github.io/AeroSpace/commands

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse window-lazy-center']

automatically-unhide-macos-hidden-apps = true

# AeroSpace binds physical keys. The Mac types Colemak-DH Matrix, so map each
# letter to the QWERTY key it sits on; alt-h then means the key that types h,
# as on Hyprland.
[key-mapping]
    preset = 'qwerty'

[key-mapping.key-notation-to-key-code]
    q = 'q'
    w = 'w'
    f = 'e'
    p = 'r'
    b = 't'
    j = 'y'
    l = 'u'
    u = 'i'
    y = 'o'
    a = 'a'
    r = 's'
    s = 'd'
    t = 'f'
    g = 'g'
    m = 'h'
    n = 'j'
    e = 'k'
    i = 'l'
    o = 'semicolon'
    z = 'z'
    x = 'x'
    c = 'c'
    d = 'v'
    v = 'b'
    k = 'n'
    h = 'm'

[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0

[mode.main.binding]
    # Disable "hide application" and "hide others".
    cmd-h = []
    cmd-alt-h = []

    alt-space = 'layout floating tiling'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'

    alt-r = 'mode resize'

# Resize mode, as Hyprland's Super+R: plain keys resize, alt focuses as
# outside, shift swaps, = evens out the workspace.
[mode.resize.binding]
    h = 'resize width -50'
    l = 'resize width +50'
    k = 'resize height -50'
    j = 'resize height +50'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    shift-h = 'swap left'
    shift-j = 'swap down'
    shift-k = 'swap up'
    shift-l = 'swap right'

    r = 'layout horizontal vertical'
    equal = 'balance-sizes'

    esc = 'mode main'
    alt-r = 'mode main'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.dawproject.daw'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.prismlauncher.PrismLauncher'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'NULL-APP-BUNDLE-ID'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.ableton.live'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 3'
