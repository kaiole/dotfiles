TS_SEARCH_PATHS=( "$HOME/personal" "$HOME/images" "$HOME/vault:0"
"$HOME/vault/books:1" "$HOME/vault/papers:1" "$HOME/dotfiles"
"$HOME/dotfiles/pi" "$HOME/school" "$HOME/sandbox" "$HOME/whitebox" "$HOME/.local"
"$HOME/.config:0" "$HOME/.codex:0" "$HOME/.ssh:0" "$HOME/.pi:0"
"$HOME/downloads" "$HOME/dotfiles/pi/picosystem" "$HOME/raw" "$HOME/videos"
"$HOME/demo")

TS_EXTRA_SEARCH_PATHS=() 

TS_IGNORE_PATHS=()

TS_MAX_DEPTH=1

# Central preset assignments. Each root includes all descendants; deepest wins.
# Paths may use $HOME or a literal ~/ prefix. Missing directories are skipped.
TS_DEFAULT_PRESET=default
TS_PRESET_RULES=(
    "$HOME/raw|agent"
    "$HOME/.config|agent"
    "$HOME/personal|agent"
    "$HOME/wb|agent"
    "$HOME/vault|agent"
    "$HOME/vault/books|read"
    "$HOME/vault/papers|read"
    "$HOME/school|agent"
    "$HOME/images|yazi"
    "$HOME/sandbox|agent"
    "$HOME/dotfiles|agent"
    "$HOME/videos|zsh"
)
