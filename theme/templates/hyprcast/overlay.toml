# GENERATED by theme/build.lua from theme/templates/hyprcast/overlay.toml -- edit that instead.
# Compact everyday overlay in the bottom-right corner.
[window]
monitor = "eDP-1"
anchor = "bottom-right"
margins = [24, 24, 24, 24]
width = 600
height = 60
dynamic_size = false
min_width = 240
min_height = 60
click_through = true

[appearance]
background_color = "{{bg_alt}}"
background_opacity = 0.94
corner_radius = 0
panel_border_width = 2
panel_border_color = "{{fg_faint}}"
foreground_color = "{{fg_strong}}"
font_family = "CaskaydiaCove Nerd Font"
font_size = 30
font_weight = "medium"
history_padding_x = 16
text_extra_padding_x = 4

[display]
panel_visibility = "with-content"

[history]
backspace = "delete"
max_retained_utf16_code_units = 4096

[repeat]
enabled = false
presentation = "counted"
count_threshold = 4

[expiration]
after_ms = 1500
fade_duration_ms = 350

[theme]
id = "builtin:default"
# The default theme uses shared appearance settings, not theme.options.

[symbols.keys]
Left = "←"
Right = "→"
Up = "↑"
Down = "↓"
Enter = "↵"
Tab = "⇥"
Delete = "⌦"

[symbols.modifiers]
Shift = "⇧"
Super = "Cmd"

