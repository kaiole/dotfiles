# GENERATED by theme/build.lua from theme/templates/tmux/colors.conf -- edit that instead.
# tmux 3.8 uses these named colors internally (including choose-tree +/-).
# Set both variants so terminal light/dark detection cannot bypass our palette.
set-option -sq dark-theme-black       "{{bg}}"
set-option -sq dark-theme-white       "{{fg}}"
set-option -sq dark-theme-light-grey  "{{fg_muted}}"
set-option -sq dark-theme-dark-grey   "{{surface}}"
set-option -sq dark-theme-red         "{{error}}"
set-option -sq dark-theme-green       "{{success}}"
set-option -sq dark-theme-yellow      "{{warning}}"
set-option -sq dark-theme-blue        "{{ansi4}}"
# tmux hardcodes tagged tree rows to theme-cyan; use neutral text, leaving * as the marker.
set-option -sq dark-theme-cyan        "{{fg_max}}"
set-option -sq dark-theme-magenta     "{{ansi5}}"
set-option -sq light-theme-black      "{{bg}}"
set-option -sq light-theme-white      "{{fg}}"
set-option -sq light-theme-light-grey "{{fg_muted}}"
set-option -sq light-theme-dark-grey  "{{surface}}"
set-option -sq light-theme-red        "{{error}}"
set-option -sq light-theme-green      "{{success}}"
set-option -sq light-theme-yellow     "{{warning}}"
set-option -sq light-theme-blue       "{{ansi4}}"
set-option -sq light-theme-cyan       "{{fg_max}}"
set-option -sq light-theme-magenta    "{{ansi5}}"
set-option -g status-fg                     "{{fg_max}}"
set-option -g status-bg                     "{{surface}}"
set-option -g copy-mode-current-match-style "fg={{bg_alt}},bg={{fg_strong}}"
set-option -g copy-mode-match-style         "fg={{bg_alt}},bg={{fg_strong}}"
set-option -g display-panes-active-colour   "{{accent}}"
set-option -g display-panes-colour          "{{fg_muted}}"
set-option -gq display-panes-border-style   "fg={{border}},bg=default"
set-option -g menu-border-style             "fg={{border}},bg=default"
set-option -g menu-selected-style           "fg={{bg_alt}},bg={{fg_max}}"
set-option -g menu-style                    "fg={{fg_max}},bg={{bg_alt}}"
set-option -g message-style                 "bg={{fg_muted}},fg={{bg_alt}}" # command in vi-insert mode
set-option -g message-command-style         "bg={{fg_muted}},fg={{fg_faint}}" # command in vi-normal mode
set-option -g mode-style                    "bg={{fg_strong}},fg={{bg_alt}}"
set-option -g pane-active-border-style      "fg={{fg_strong}}"
set-option -g pane-border-lines             "simple"
set-option -g pane-border-style             "fg={{border}}"
# Keep popups transparent instead of inheriting tmux 3.8's built-in theme background.
set-option -g popup-style                   "fg={{fg}},bg=default"
set-option -g popup-border-style            "fg={{fg}},bg=default"
set-option -g popup-border-lines            "rounded"
set-option -g status-right-style            "fg={{fg_strong}}"
# Keep the tree selection on a contrasting surface.
set-option -g tree-mode-selection-style     "fg={{fg_max}},bg={{surface}},bold"
# Tree viewer preview frames and labels must not inherit a solid theme background.
set-option -g tree-mode-border-style        "fg={{fg_muted}},bg=default"
set-option -g tree-mode-preview-style       "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},{{accent}},{{fg_muted}}},bg=default"
set-option -g window-status-current-style   "fg={{fg_strong}}"
set-option -g window-status-style           "fg={{fg_muted}}"
