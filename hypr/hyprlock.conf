# Lock screen. Started by hypridle's lock_cmd (see hypridle.conf); lock with
# `loginctl lock-session`, not by running hyprlock directly.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Layout: clock and date over an empty box that the password fills with
# asterisks. All positions are offsets from the screen center, picked so the
# group sits centered vertically.

source = hyprlock-colors.conf
$font = CaskaydiaCove Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

# Current wallpaper, linked by scripts/lock; $bg until it loads or if missing
background {
    monitor =
    path = ~/.cache/hyprlock-wallpaper
    color = $bg
}

# Veil: bg at Ghostty's background-opacity, so text reads like in a terminal
shape {
    monitor =
    size = 100%, 100%
    color = rgba($bg_rgb, 0.6)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

# Clock and date
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    color = $fg_max
    font_size = 64
    font_family = $font ExtraLight
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $fg_muted
    font_size = 18
    font_family = $font
    position = 0, 25
    halign = center
    valign = center
}

# Box
shape {
    monitor =
    size = 300, 34
    color = rgba(00000000)
    rounding = 0
    border_size = 2
    border_color = $fg_max
    position = 0, -37
    halign = center
    valign = center
}

# Typed characters as contiguous asterisks, centered in the box.
# Borderless with swap_font_color, so the check/fail/caps-lock colors recolor
# the asterisks instead of filling the field.
input-field {
    monitor =
    size = 280, 20
    outline_thickness = 0
    rounding = 0
    inner_color = rgba(00000000)
    font_color = $fg_max
    check_color = $fg_dim
    fail_color = $error
    capslock_color = $warning
    swap_font_color = true
    font_family = $font
    dots_text_format = *
    dots_size = 0.6
    dots_spacing = 0
    dots_center = true
    fade_on_empty = false
    placeholder_text =
    fail_text =
    position = 0, -37
    halign = center
    valign = center
}

# PAM's failure message, refreshed on each attempt
label {
    monitor =
    text = $FAIL
    color = $error
    font_size = 11
    font_family = $font
    position = 0, -79
    halign = center
    valign = center
}
