# Idle and sleep: blank, lock, then suspend.
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # Everything locks through logind, so this is the only place hyprlock starts.
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock
    # Also covers lid close; hypridle holds suspend until the lock is up.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# A blocking sleep inhibitor (Claude Code's keep-awake lock) would refuse the
# suspend, and a timeout only fires once, so wait for it and check each minute.
# Only input cancels the wait: after a lid-close suspend, opening the lid and
# not touching anything can suspend again within a minute. Accepted.
# The lock is dropped at Stop and retaken only on a prompt, so a turn that a
# Stop hook continues (/goal) runs without it. A transcript written in the
# last 10 minutes therefore also holds off the suspend; subagents write there.
listener {
    timeout = 1800
    condition_cmd = ! systemd-inhibit --list --json=short | jq -e 'any(.[]; .mode == "block" and (.what | test("sleep")))' >/dev/null && ! find ~/.claude/projects/ -name '*.jsonl' -mmin -10 -print -quit 2>/dev/null | grep -q .
    condition_retry = 60
    on-timeout = systemctl suspend
}
