# defaults
set -g detach-on-destroy off

set -g mouse on
unbind-key -T root C-MouseDown1Pane

set -g default-terminal "tmux-256color"
set -gq allow-passthrough on
set -g cursor-style blinking-block

set -g renumber-windows on
set -g base-index 1
bind c new-window -c '#{pane_current_path}'

set -g extended-keys on
set -g extended-keys-format csi-u

# binds
set -g prefix C-a

unbind r
bind r source-file $HOME/dotfiles/tmux/tmux.conf

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

setw -g mode-keys vi
bind-key h if-shell -F '#{pane_at_left}'   '' 'select-pane -L'
bind-key j if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key k if-shell -F '#{pane_at_top}'    '' 'select-pane -U'
bind-key l if-shell -F '#{pane_at_right}'  '' 'select-pane -R'

bind-key X confirm-before -p "Kill current session? (y/n)" "kill-session -t \"#S\""
bind-key K confirm-before -p "Kill server? (y/n)" "kill-server"

bind-key N run-shell "~/.local/bin/tmux-sessionizer ~/notes"

bind-key o switch-client -l

# bar
set -g status-right '#{s|^/home/red|~|:pane_current_path}'
set -g status-right-length 100
set -g status-left '[#{?client_prefix,⸸,}#S#{?client_prefix,⸸,}] '
set -g status-left-length 100

set -g window-status-format '#I:#W'
set -g window-status-current-format '[#I:#W]'

# plugins
set -g @plugin 'tmux-plugins/tpm'

# colors: generated from theme/templates/tmux/colors.conf
source-file ~/dotfiles/tmux/colors.conf

run '$HOME/dotfiles/tmux/plugins/tpm/tpm'
