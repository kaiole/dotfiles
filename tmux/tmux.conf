# defaults
set -g detach-on-destroy off

set -g mouse on
unbind-key -T root C-MouseDown1Pane

set -g default-terminal "tmux-256color"
set -gq allow-passthrough on
set -g cursor-style blinking-block
# Forward terminal focus changes so nvim's FocusGained fires (statusline git refresh).
set -g focus-events on

set -g renumber-windows on
set -g base-index 1
# ROS sessions track the container cwd through ros-tmux; ordinary sessions use
# plain tmux commands, so they never depend on that script.
bind c if-shell -F '#{@ros_container}' {
  run-shell '"$HOME/dotfiles/scripts/tmux-sessionizer/ros-tmux" create "#{pane_id}" new-window'
} {
  new-window -c "#{pane_current_path}"
}
bind '"' if-shell -F '#{@ros_container}' {
  run-shell '"$HOME/dotfiles/scripts/tmux-sessionizer/ros-tmux" create "#{pane_id}" split-window'
} {
  split-window
}
bind % if-shell -F '#{@ros_container}' {
  run-shell '"$HOME/dotfiles/scripts/tmux-sessionizer/ros-tmux" create "#{pane_id}" split-window -h'
} {
  split-window -h
}
# The picker runs on the host; no host-exec bridge or nested tmux client needed.
bind -T root C-f if-shell -F '#{@ros_container}' {
  run-shell '"$HOME/dotfiles/scripts/tmux-sessionizer/ros-tmux" picker #{pane_id}'
} {
  # Claude Code leaves C-f unbound, so tmux handles it there.
  if-shell -F '#{==:#{pane_current_command},claude}' {
    run-shell '"$HOME/.local/bin/tmux-sessionizer"'
  } {
    send-keys C-f
  }
}
# Works from any pane and program, including Neovim inside the ROS container.
bind C-f run-shell '"$HOME/.local/bin/tmux-sessionizer"'

set -g extended-keys on
set -g extended-keys-format csi-u

# binds
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

unbind r
bind r source-file $HOME/dotfiles/tmux/tmux.conf

# Small, action-first shell-editing reference in the top-right corner. A
# floating pane, not a popup, so it can stay up without taking input; -A keeps
# it above a zoomed pane. Its border reuses the active-border color, resolved at
# draw time so theme switches apply. Toggles per window. run-shell -C because
# kill-pane -t and move-pane -t do not expand formats.
%hidden SHORTCUTS_PANE='#{P:#{?#{m:*shortcuts.sh*,#{pane_start_command}},#{pane_id},}}'
bind b if-shell -F "$SHORTCUTS_PANE" {
  run-shell -C "kill-pane -t '$SHORTCUTS_PANE'"
} {
  new-pane -d -A -B single -R '#{pane-active-border-style}' -x 48 -y 12 -X '#{e|-:#{window_width},48}' -Y 0 'bash "$HOME/dotfiles/tmux/shortcuts.sh"'
}
# Floating panes keep their left offset on resize; pin this one to the corner.
set-hook -g window-resized[10] {
  if-shell -F "$SHORTCUTS_PANE" { run-shell -C "move-pane -P top-right -t '$SHORTCUTS_PANE'" }
}

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

setw -g mode-keys vi
bind-key h if-shell -F '#{pane_at_left}'   '' 'select-pane -L'
bind-key j if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key k if-shell -F '#{pane_at_top}'    '' 'select-pane -U'
bind-key l if-shell -F '#{pane_at_right}'  '' 'select-pane -R'

bind-key X confirm-before -p "Kill current session? (y/n)" "kill-session -t \"#S\""
bind-key K confirm-before -p "Kill server? (y/n)" "kill-server"

bind-key o switch-client -l

# detach but keep the terminal open in a plain shell (e.g. to ssh)
bind-key D detach-client -E "exec zsh -l"

# bar
set -g status-right "#{s|^$HOME|~|:pane_current_path}"
set -g status-right-length 100
set -g status-left '[#{?client_prefix,⸸,}#S#{?client_prefix,⸸,}] '
set -g status-left-length 100

set -g window-status-format '#I:#W'
set -g window-status-current-format '[#I:#W]'

# colors: generated from theme/templates/tmux/colors.conf
source-file ~/dotfiles/tmux/colors.conf
