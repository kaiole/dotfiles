# Minimal demo, centered on eDP-1 (1920x1080 logical pixels).
# Bottom anchoring centers horizontally; bottom margin = (1080 - height) / 2.
# If the display changes, recalculate that margin. Original overlay.toml is untouched.
[window]
monitor = "eDP-1"
anchor = "bottom"
margins = [0, 0, 0, 450]
width = 1200
height = 180
dynamic_size = false
min_width = 240
min_height = 64
click_through = true

[appearance]
background_color = "#080808"
background_opacity = 0.94
corner_radius = 16
panel_border_width = 1
panel_border_color = "#444444"
foreground_color = "#cccccc"
font_family = "CaskaydiaCove Nerd Font"
font_size = 64
font_weight = "medium"
history_padding_x = 32
text_extra_padding_x = 8

[display]
panel_visibility = "with-content"

[history]
backspace = "delete"
max_retained_utf16_code_units = 4096

[repeat]
enabled = false
presentation = "counted"
count_threshold = 4

[expiration]
after_ms = 1500
fade_duration_ms = 350

[theme]
id = "builtin:default"
# Minimal uses shared appearance settings, not theme.options.

[symbols.keys]
Left = "←"
Right = "→"
Up = "↑"
Down = "↓"
Enter = "↵"
Tab = "⇥"
Delete = "⌦"

[symbols.modifiers]
Shift = "⇧"
Super = "Cmd"
