# Modifier Dock demo, centered on eDP-1 (1920x1080 logical pixels).
# Bottom anchoring centers horizontally; bottom margin = (1080 - height) / 2.
# Two fixed rows: large history caps above, live modifiers below.
[window]
monitor = "eDP-1"
anchor = "bottom"
margins = [0, 0, 0, 390]
width = 1200
height = 300
dynamic_size = false
min_width = 240
min_height = 64
click_through = true

[appearance]
background_color = "#080808"
background_opacity = 0.94
corner_radius = 16
panel_border_width = 1
panel_border_color = "#444444"
foreground_color = "#cccccc"
font_family = "CaskaydiaCove Nerd Font"
font_size = 48
font_weight = "medium"
history_padding_x = 32
text_extra_padding_x = 8

[display]
panel_visibility = "always" # Keep idle modifier slots visible for the demo.

[history]
backspace = "delete"
max_retained_utf16_code_units = 4096

[repeat]
enabled = false
presentation = "counted"
count_threshold = 4

[expiration]
after_ms = 1500
fade_duration_ms = 350

[theme]
id = "text-held"

[theme.options]
font_size = 48
height = 96
padding_x = 28
radius = 12
edge_depth = 6
edge_color = "#101010"
border_width = 1
border_color = "#444444"
text_color = "#cccccc"
text_background = "#191919"
key_background = "#2a2a2a"
inner_spacing = 6
visible_groups = 12
group_spacing = 12
motion = "full"
transition_ms = 180
show_held_keys = true
show_altgr = false
dock_alignment = "center"
dock_spacing = 12
dock_idle_opacity = 0.45
dock_active_background = "#444444"
row_gap = 24
inner_padding = 20

[symbols.keys]
Left = "←"
Right = "→"
Up = "↑"
Down = "↓"
Enter = "↵"
Tab = "⇥"
Delete = "⌦"

[symbols.modifiers]
Shift = "⇧"
Super = "Cmd"
